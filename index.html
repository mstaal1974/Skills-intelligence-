<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Blocksure Skills Intelligence</title>
    <script>
      // Self-heal stale caches on GitHub Pages. Each deploy renames the hashed
      // bundle; if a browser replays a cached index.html that points at an old
      // (or raw-source) file, the module script fails to load. Detect that and
      // reload once against a fresh URL so the current index.html is fetched.
      (function () {
        try {
          var KEY = 'bsi-cache-recover';
          window.addEventListener('error', function (e) {
            var t = e && e.target;
            if (t && t.tagName === 'SCRIPT' && t.src && sessionStorage.getItem(KEY) !== '1') {
              sessionStorage.setItem(KEY, '1');
              location.replace(location.pathname + '?r=' + Date.now());
            }
          }, true);
        } catch (_) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>

      tailwind.config = { darkMode: 'class' };

    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.0.1/dist/chartjs-chart-matrix.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           Glassmorphic design system
           ============================================================ */
        :root {
            --bg-1: #eef4ff;
            --bg-2: #f5f0ff;
            --bg-3: #e9fbff;
            --blob-1: rgba(99, 102, 241, 0.35);
            --blob-2: rgba(56, 189, 248, 0.32);
            --blob-3: rgba(236, 72, 153, 0.22);

            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-bg-strong: rgba(255, 255, 255, 0.72);
            --glass-bg-soft: rgba(255, 255, 255, 0.38);
            --glass-border: rgba(255, 255, 255, 0.7);
            --glass-hairline: rgba(148, 163, 184, 0.28);
            --glass-shadow: 0 10px 30px -12px rgba(30, 41, 59, 0.28);
            --glass-shadow-lg: 0 24px 60px -20px rgba(30, 41, 59, 0.4);

            --input-bg: rgba(255, 255, 255, 0.6);

            --text-strong: #0f172a;
            --text: #334155;
            --text-muted: #64748b;

            --accent: #4A90E2;
            --accent-strong: #2f6fd0;
            --accent-2: #06b6d4;
        }

        html.dark {
            --bg-1: #0b1120;
            --bg-2: #131033;
            --bg-3: #071a24;
            --blob-1: rgba(99, 102, 241, 0.34);
            --blob-2: rgba(14, 165, 233, 0.28);
            --blob-3: rgba(217, 70, 239, 0.22);

            --glass-bg: rgba(30, 41, 59, 0.5);
            --glass-bg-strong: rgba(30, 41, 59, 0.72);
            --glass-bg-soft: rgba(30, 41, 59, 0.34);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-hairline: rgba(148, 163, 184, 0.2);
            --glass-shadow: 0 12px 34px -12px rgba(0, 0, 0, 0.6);
            --glass-shadow-lg: 0 28px 70px -20px rgba(0, 0, 0, 0.7);

            --input-bg: rgba(15, 23, 42, 0.5);

            --text-strong: #f1f5f9;
            --text: #cbd5e1;
            --text-muted: #94a3b8;

            --accent: #60a5fa;
            --accent-strong: #3b82f6;
            --accent-2: #22d3ee;
        }

        * { -webkit-tap-highlight-color: transparent; }

        html, body { min-height: 100%; }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        /* Soft, slowly drifting colour blobs behind the frosted glass. */
        body::before,
        body::after {
            content: "";
            position: fixed;
            z-index: -2;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
        }
        body::before {
            width: 46vw; height: 46vw;
            top: -12vw; left: -8vw;
            background: radial-gradient(circle at 30% 30%, var(--blob-1), transparent 70%);
            animation: drift1 20s ease-in-out infinite alternate;
        }
        body::after {
            width: 42vw; height: 42vw;
            bottom: -14vw; right: -10vw;
            background: radial-gradient(circle at 60% 60%, var(--blob-2), transparent 70%);
            animation: drift2 24s ease-in-out infinite alternate;
        }
        #bg-blob-3 {
            position: fixed;
            z-index: -2;
            width: 34vw; height: 34vw;
            top: 40%; left: 55%;
            border-radius: 50%;
            filter: blur(100px);
            background: radial-gradient(circle at 50% 50%, var(--blob-3), transparent 70%);
            animation: drift3 28s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(6vw, 5vw) scale(1.12); } }
        @keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-5vw, -4vw) scale(1.15); } }
        @keyframes drift3 { from { transform: translate(-50%,-50%) scale(1); } to { transform: translate(-40%,-60%) scale(1.2); } }
        @media (prefers-reduced-motion: reduce) {
            body::before, body::after, #bg-blob-3 { animation: none; }
        }

        /* ---- Frosted glass surfaces ---- */
        .glass-card {
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(18px) saturate(150%);
            backdrop-filter: blur(18px) saturate(150%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 1.25rem;
        }
        .glass-strong {
            background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            backdrop-filter: blur(22px) saturate(160%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        .glass-soft {
            background: var(--glass-bg-soft);
            -webkit-backdrop-filter: blur(12px) saturate(140%);
            backdrop-filter: blur(12px) saturate(140%);
            border: 1px solid var(--glass-hairline);
            border-radius: 1rem;
        }

        /* ---- Top bar ---- */
        .glass-topbar {
            background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            backdrop-filter: blur(22px) saturate(160%);
            border-bottom: 1px solid var(--glass-border);
        }

        /* ---- Sidebar ---- */
        .glass-sidebar {
            background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            backdrop-filter: blur(24px) saturate(160%);
            border-right: 1px solid var(--glass-border);
        }
        .side-link {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 100%;
            padding: 10px 4px;
            border-radius: 0.9rem;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: color .2s ease, background .2s ease, transform .2s ease;
        }
        .side-link:hover { color: var(--accent-strong); background: rgba(74, 144, 226, 0.1); }
        .side-link.active {
            color: #fff;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
            box-shadow: 0 8px 20px -6px rgba(74, 144, 226, 0.65);
        }
        html.dark .side-link.active { color: #fff; }
        .side-link svg { width: 22px; height: 22px; }

        /* Mobile pill nav */
        .pill-link {
            white-space: nowrap;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            border: 1px solid transparent;
            transition: all .2s ease;
        }
        .pill-link.active {
            color: #fff;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
            box-shadow: 0 8px 18px -8px rgba(74, 144, 226, 0.7);
        }

        /* ---- Chips / buttons in top bar ---- */
        .glass-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--glass-bg-soft);
            border: 1px solid var(--glass-hairline);
            color: var(--text);
            font-weight: 600;
            font-size: 13px;
        }
        .icon-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px; height: 40px;
            border-radius: 999px;
            background: var(--glass-bg-soft);
            border: 1px solid var(--glass-hairline);
            color: var(--text);
            transition: all .2s ease;
        }
        .icon-btn:hover { color: var(--accent-strong); transform: translateY(-1px); }

        /* ---- KPI cards ---- */
        .kpi-card { transition: transform .3s ease, box-shadow .3s ease; }
        .kpi-card:hover { transform: translateY(-5px); box-shadow: var(--glass-shadow-lg); }

        /* ---- Progress bars ---- */
        .progress-track {
            background: rgba(148, 163, 184, 0.25);
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            box-shadow: 0 1px 6px -1px rgba(74, 144, 226, 0.5);
            transform-origin: left center;
            animation: growX .9s cubic-bezier(.22, 1, .36, 1) both;
        }
        @keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
        @media (prefers-reduced-motion: reduce) { .progress-fill { animation: none; } }

        /* Nudge interactive list rows / quick actions on hover */
        .hover-slide { transition: transform .2s ease, background .2s ease, box-shadow .2s ease; }
        .hover-slide:hover { transform: translateX(4px); }

        /* ---- Nav (legacy top nav classes, kept for safety) ---- */
        .nav-active { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
        .nav-inactive { border-bottom-color: transparent; color: var(--text-muted); }

        /* ---- Buttons ---- */
        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
            color: #fff;
            box-shadow: 0 10px 22px -10px rgba(74, 144, 226, 0.8);
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
        }
        .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.05); }
        .btn-primary:disabled { background: rgba(148,163,184,0.5); box-shadow: none; transform: none; cursor: not-allowed; }
        .btn-secondary {
            background: rgba(74, 144, 226, 0.14);
            color: var(--accent-strong);
            border: 1px solid rgba(74, 144, 226, 0.28);
            transition: background .2s ease, transform .2s ease;
        }
        .btn-secondary:hover { background: rgba(74, 144, 226, 0.24); transform: translateY(-1px); }

        .heatmap-btn-active {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
            color: #fff;
            box-shadow: 0 6px 14px -6px rgba(74,144,226,0.7);
        }
        .heatmap-btn-inactive { background: transparent; color: var(--text-muted); }

        /* ---- Form controls ---- */
        input[type="text"], input[type="number"], select, textarea {
            background: var(--input-bg);
            color: var(--text-strong);
            border: 1px solid var(--glass-hairline);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.25);
        }
        select option { color: #0f172a; }
        input::placeholder { color: var(--text-muted); }

        .chart-container { position: relative; width: 100%; max-width: 800px; margin-left: auto; margin-right: auto; height: 450px; max-height: 60vh; }

        /* ---- Scrollbar ---- */
        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.45); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.7); }

        /* ---- Modal ---- */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.45);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            /* Overlay is the scroll container; margin:auto on the child centres it
               when it fits and lets it scroll (never clip) when it is taller. */
            display: flex;
            overflow-y: auto;
            overscroll-behavior: contain;
            z-index: 50; opacity: 0; pointer-events: none; transition: opacity .3s ease;
            padding: clamp(0.75rem, 4vh, 2.5rem) clamp(0.75rem, 4vw, 1.5rem);
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(26px) saturate(160%);
            backdrop-filter: blur(26px) saturate(160%);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: clamp(1.25rem, 3vw, 2rem);
            border-radius: 1.25rem;
            width: 100%;
            margin: auto;               /* centres when it fits, top-aligns + scrolls when tall */
            box-shadow: var(--glass-shadow-lg);
            overflow-wrap: break-word;
            transform: scale(0.96) translateY(8px); transition: transform .3s ease;
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }

        /* ---- Loader ---- */
        .loader {
            border: 4px solid rgba(148, 163, 184, 0.25);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-overlay {
            position: absolute; inset: 0;
            background: var(--glass-bg-soft);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 10; border-radius: inherit;
        }

        /* ============================================================
           Dark-mode adjustments for Tailwind's hard-coded utilities
           ============================================================ */
        html.dark body { color: var(--text); }
        html.dark .text-gray-900, html.dark .text-gray-800 { color: var(--text-strong) !important; }
        html.dark .text-gray-700, html.dark .text-gray-600 { color: var(--text) !important; }
        html.dark .text-gray-500, html.dark .text-gray-400 { color: var(--text-muted) !important; }
        html.dark .bg-gray-50 { background-color: rgba(255,255,255,0.04) !important; }
        html.dark .bg-gray-100 { background-color: rgba(255,255,255,0.06) !important; }
        html.dark .bg-gray-200 { background-color: rgba(255,255,255,0.12) !important; }
        html.dark .border, html.dark .border-t, html.dark .border-b { border-color: var(--glass-hairline) !important; }
        html.dark .divide-gray-200 > :not([hidden]) ~ :not([hidden]) { border-color: var(--glass-hairline) !important; }
        html.dark .hover\:bg-gray-50:hover, html.dark .hover\:bg-gray-100:hover { background-color: rgba(255,255,255,0.06) !important; }

        html.dark .bg-blue-50 { background-color: rgba(59,130,246,0.16) !important; }
        html.dark .bg-green-50, html.dark .bg-green-100 { background-color: rgba(34,197,94,0.16) !important; }
        html.dark .bg-yellow-50 { background-color: rgba(234,179,8,0.16) !important; }
        html.dark .hover\:bg-yellow-100:hover { background-color: rgba(234,179,8,0.24) !important; }
        html.dark .hover\:bg-blue-100:hover { background-color: rgba(59,130,246,0.24) !important; }
        html.dark .hover\:bg-green-100:hover { background-color: rgba(34,197,94,0.24) !important; }
        html.dark .hover\:bg-purple-100:hover { background-color: rgba(168,85,247,0.24) !important; }
        html.dark .bg-red-50 { background-color: rgba(239,68,68,0.16) !important; }
        html.dark .bg-blue-100 { background-color: rgba(59,130,246,0.22) !important; }
        html.dark .bg-purple-50 { background-color: rgba(168,85,247,0.16) !important; }

        html.dark .text-blue-900, html.dark .text-blue-800, html.dark .text-blue-700 { color: #93c5fd !important; }
        html.dark .text-green-900, html.dark .text-green-800, html.dark .text-green-700, html.dark .text-green-600 { color: #86efac !important; }
        html.dark .text-yellow-900, html.dark .text-yellow-800, html.dark .text-yellow-700, html.dark .text-yellow-600 { color: #fde047 !important; }
        html.dark .text-red-800, html.dark .text-red-700, html.dark .text-red-600 { color: #fca5a5 !important; }
        html.dark .text-purple-800, html.dark .text-purple-700, html.dark .text-purple-600 { color: #d8b4fe !important; }

        /* Fade / slide-in for section content */
        .fade-in { animation: fadeIn .4s ease both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    </style>
