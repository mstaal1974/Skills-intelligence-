name: Deploy to GitHub Pages

# Builds the Vite app and publishes the dist/ output to GitHub Pages.
# The site is served at https://<user>.github.io/<repo>/ — the relative
# base ("./") in vite.config.ts keeps asset URLs valid under that sub-path.
#
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source = "GitHub Actions".

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Optional: add a repository secret named GEMINI_API_KEY to enable
          # the AI features. Without it the UI still loads normally.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
